<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Mosaic | Past weeks</title>
<style>
  body { margin: 0; padding: 24px; background: #120f24; color: #f4f1ff;
    font-family: "Helvetica Neue", Arial, sans-serif; text-align: left; }
  a { color: #9fd8ff; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
  figure { margin: 0; }
  img { width: 100%; display: block; }
  figcaption { font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<a href="index.html">Current week</a>
<div id="grid"></div>
<script>
fetch("images/index.json", { cache: "no-store" }).then(r => r.json()).then(list => {
  const grid = document.getElementById("grid");
  list.slice().reverse().forEach(d => {
    grid.insertAdjacentHTML("beforeend",
      `<figure><a href="images/${d}.png"><img src="images/${d}.png" loading="lazy" alt="Mosaic for ${d}"></a>` +
      `<figcaption>${d}</figcaption></figure>`);
  });
});
</script>
</body>
</html>
